<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- rounded background -->
  <defs>
    <clipPath id="r">
      <rect x="2" y="2" width="60" height="60" rx="14" ry="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#r)">
    <!-- mosaic tiles (rough) -->
    <rect x="0" y="0" width="64" height="64" fill="#0b1020"/>
    <g opacity="0.98">
      <!-- row 1 -->
      <rect x="2"  y="2"  width="14" height="12" rx="3" fill="#2b6cff"/>
      <rect x="17" y="3"  width="12" height="11" rx="3" fill="#27d7ff"/>
      <rect x="30" y="2"  width="14" height="12" rx="3" fill="#39d98a"/>
      <rect x="45" y="3"  width="17" height="11" rx="3" fill="#ffd24a"/>
      <!-- row 2 -->
      <rect x="3"  y="15" width="13" height="13" rx="3" fill="#1f49b8"/>
      <rect x="17" y="15" width="15" height="14" rx="3" fill="#7b4dff"/>
      <rect x="33" y="15" width="12" height="14" rx="3" fill="#24c16b"/>
      <rect x="46" y="15" width="15" height="14" rx="3" fill="#ff9f2f"/>
      <!-- row 3 -->
      <rect x="2"  y="30" width="16" height="13" rx="3" fill="#6a2cff"/>
      <rect x="19" y="30" width="14" height="13" rx="3" fill="#3aa0ff"/>
      <rect x="34" y="30" width="14" height="13" rx="3" fill="#ffe45c"/>
      <rect x="49" y="30" width="13" height="13" rx="3" fill="#ff5a3a"/>
      <!-- row 4 -->
      <rect x="3"  y="44" width="14" height="18" rx="3" fill="#ff3b6b"/>
      <rect x="18" y="44" width="15" height="18" rx="3" fill="#ff6a00"/>
      <rect x="34" y="44" width="14" height="18" rx="3" fill="#39d98a"/>
      <rect x="49" y="44" width="13" height="18" rx="3" fill="#7b4dff"/>

      <!-- extra little shards to feel "mosaic" -->
      <rect x="10" y="23" width="6" height="6" rx="2" fill="#27d7ff" opacity="0.95"/>
      <rect x="48" y="7"  width="7" height="6" rx="2" fill="#39d98a" opacity="0.9"/>
      <rect x="28" y="52" width="6" height="7" rx="2" fill="#ffd24a" opacity="0.9"/>
      <rect x="56" y="24" width="6" height="6" rx="2" fill="#2b6cff" opacity="0.9"/>
    </g>

    <!-- center star (simple, readable at small sizes) -->
    <path d="M32 13
             L36.2 27.8
             L51 32
             L36.2 36.2
             L32 51
             L27.8 36.2
             L13 32
             L27.8 27.8 Z"
          fill="#ffffff" opacity="0.95"/>

    <!-- subtle inner highlight -->
    <path d="M32 18
             L35 28.5
             L45.5 32
             L35 35.5
             L32 46
             L29 35.5
             L18.5 32
             L29 28.5 Z"
          fill="#ffffff" opacity="0.18"/>
  </g>

  <!-- border -->
  <rect x="2" y="2" width="60" height="60" rx="14" ry="14"
			fill="none" stroke="#0b1020" stroke-opacity="0.25" stroke-width="2"/>
</svg>
